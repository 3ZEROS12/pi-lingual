<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" width="920" height="740">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3339" />
      <stop offset="100%" stop-color="#232a2e" />
    </linearGradient>
  </defs>

  <!-- Window Container with Shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="15" width="880" height="705" rx="12" fill="#1e2326" stroke="#343f44" stroke-width="1.2" />

    <!-- Titlebar -->
    <path d="M 20,27 A 12,12 0 0,1 32,15 L 888,15 A 12,12 0 0,1 900,27 L 900,52 L 20,52 Z" fill="url(#headerGrad)" stroke="#343f44" stroke-width="1" />
    <line x1="20" y1="52" x2="900" y2="52" stroke="#2d353b" stroke-width="1" />

    <!-- Window Controls (macOS Dots) -->
    <circle cx="44" cy="33.5" r="5.5" fill="#e67e80" />
    <circle cx="62" cy="33.5" r="5.5" fill="#dbbc7f" />
    <circle cx="80" cy="33.5" r="5.5" fill="#a7c080" />

    <!-- Window Title -->
    <text x="460" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#859289" letter-spacing="0.3">
      pi-lingual · Real-World Software Engineering Multilingual Matrix
    </text>
  </g>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">

    <!-- Card 1: zh ➔ en (架构折衷) -->
    <g transform="translate(45, 80)">
      <text x="0" y="0">
        <tspan fill="#a7c080" font-weight="bold">#1 [zh ➔ en]</tspan>
        <tspan fill="#859289"> · Architecture Review &amp; Tech Trade-offs ❯ </tspan>
        <tspan fill="#e5c07b" font-weight="bold">这个方案有点过度设计了，不如直接用标准库实现</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#7a8478">  · </tspan>
        <tspan fill="#859289">[Source] </tspan>
        <tspan fill="#d3c6aa">这个方案有点过度设计了，不如直接用标准库实现</tspan>
      </text>
      <text x="0" y="46">
        <tspan fill="#7a8478">  ┌ </tspan>
        <tspan fill="#a7c080" font-weight="bold">[Spoken]   </tspan>
        <tspan fill="#e5c07b">This feels a bit </tspan><tspan fill="#e5c07b" text-decoration="underline">over-engineered</tspan><tspan fill="#e5c07b">; we'd be much </tspan><tspan fill="#e5c07b" text-decoration="underline">better off</tspan><tspan fill="#e5c07b"> just </tspan><tspan fill="#e5c07b" text-decoration="underline">sticking with</tspan><tspan fill="#e5c07b"> the standard library. </tspan>
        <tspan fill="#859289">(用标准库划算得多)</tspan>
      </text>
      <text x="0" y="68">
        <tspan fill="#7a8478">  ├ </tspan>
        <tspan fill="#7fbbb3" font-weight="bold">[Written]  </tspan>
        <tspan fill="#83a598">The proposed approach introduces unnecessary complexity. </tspan><tspan fill="#83a598" text-decoration="underline">Leveraging</tspan><tspan fill="#83a598"> native standard library implementations is preferred. </tspan>
        <tspan fill="#859289">(建议优先采用原生标准库)</tspan>
      </text>
      <text x="0" y="90">
        <tspan fill="#7a8478">  └ </tspan>
        <tspan fill="#dbbc7f" font-weight="bold">[Vocab]    </tspan>
        <tspan fill="#d3c6aa">over-engineered </tspan><tspan fill="#7a8478">(过度工程化) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">be better off </tspan><tspan fill="#7a8478">(更合适/更划算) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">stick with </tspan><tspan fill="#7a8478">(沿用/坚持) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">leverage </tspan><tspan fill="#7a8478">(利用/借助)</tspan>
      </text>
    </g>

    <!-- Divider Line 1 -->
    <line x1="45" y1="195" x2="875" y2="195" stroke="#2d353b" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Card 2: ja ➔ en (メモリ調達・リソース解放) -->
    <g transform="translate(45, 222)">
      <text x="0" y="0">
        <tspan fill="#7fbbb3" font-weight="bold">#2 [ja ➔ en]</tspan>
        <tspan fill="#859289"> · Systems Engineering &amp; Memory Optimization ❯ </tspan>
        <tspan fill="#e5c07b">メモリリークの可能性があるので、クリーンアップ処理を追加してください</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#7a8478">  · </tspan>
        <tspan fill="#859289">[Source] </tspan>
        <tspan fill="#d3c6aa">メモリリークの可能性があるので、クリーンアップ処理を追加してください</tspan>
      </text>
      <text x="0" y="46">
        <tspan fill="#7a8478">  ┌ </tspan>
        <tspan fill="#a7c080" font-weight="bold">[Spoken]   </tspan>
        <tspan fill="#e5c07b">There might be a memory leak here, so let's make sure we </tspan><tspan fill="#e5c07b" text-decoration="underline">toss in</tspan><tspan fill="#e5c07b"> some cleanup logic. </tspan>
        <tspan fill="#859289">(クリーンアップ処理サクッと入れとこう)</tspan>
      </text>
      <text x="0" y="68">
        <tspan fill="#7a8478">  ├ </tspan>
        <tspan fill="#7fbbb3" font-weight="bold">[Written]  </tspan>
        <tspan fill="#83a598">To prevent potential memory leaks, please incorporate explicit cleanup and resource disposal routines. </tspan>
        <tspan fill="#859289">(リソース解放処理を追加してください)</tspan>
      </text>
      <text x="0" y="90">
        <tspan fill="#7a8478">  └ </tspan>
        <tspan fill="#dbbc7f" font-weight="bold">[Vocab]    </tspan>
        <tspan fill="#d3c6aa">toss in </tspan><tspan fill="#7a8478">(手軽に追加する) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">cleanup logic </tspan><tspan fill="#7a8478">(終了処理) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">resource disposal routines </tspan><tspan fill="#7a8478">(リソース解放手順)</tspan>
      </text>
    </g>

    <!-- Divider Line 2 -->
    <line x1="45" y1="337" x2="875" y2="337" stroke="#2d353b" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Card 3: es ➔ en (PR 代码审查与原子拆分) -->
    <g transform="translate(45, 364)">
      <text x="0" y="0">
        <tspan fill="#e5c07b" font-weight="bold">#3 [es ➔ en]</tspan>
        <tspan fill="#859289"> · Code Review &amp; Git Atomic Decomposition ❯ </tspan>
        <tspan fill="#e5c07b">El PR es demasiado grande, sugiero dividirlo en dos cambios atómicos</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#7a8478">  · </tspan>
        <tspan fill="#859289">[Source] </tspan>
        <tspan fill="#d3c6aa">El PR es demasiado grande, sugiero dividirlo en dos cambios atómicos</tspan>
      </text>
      <text x="0" y="46">
        <tspan fill="#7a8478">  ┌ </tspan>
        <tspan fill="#a7c080" font-weight="bold">[Spoken]   </tspan>
        <tspan fill="#e5c07b">This PR is huge — how about we split it into a couple of </tspan><tspan fill="#e5c07b" text-decoration="underline">bite-sized</tspan><tspan fill="#e5c07b"> PRs instead? </tspan>
        <tspan fill="#859289">(¿qué tal si lo partimos en cambios manejables?)</tspan>
      </text>
      <text x="0" y="68">
        <tspan fill="#7a8478">  ├ </tspan>
        <tspan fill="#7fbbb3" font-weight="bold">[Written]  </tspan>
        <tspan fill="#83a598">The PR scope is excessively broad; decomposing it into two discrete, atomic commits is advised. </tspan>
        <tspan fill="#859289">(se aconseja descomponerlo en commits atómicos)</tspan>
      </text>
      <text x="0" y="90">
        <tspan fill="#7a8478">  └ </tspan>
        <tspan fill="#dbbc7f" font-weight="bold">[Vocab]    </tspan>
        <tspan fill="#d3c6aa">bite-sized </tspan><tspan fill="#7a8478">(fácil de digerir / manejable) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">excessively broad </tspan><tspan fill="#7a8478">(alcance excesivo) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">atomic commits </tspan><tspan fill="#7a8478">(commits atómicos)</tspan>
      </text>
    </g>

    <!-- Divider Line 3 -->
    <line x1="45" y1="479" x2="875" y2="479" stroke="#2d353b" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Card 4: de ➔ en (分布式接口幂等性设计) -->
    <g transform="translate(45, 506)">
      <text x="0" y="0">
        <tspan fill="#83a598" font-weight="bold">#4 [de ➔ en]</tspan>
        <tspan fill="#859289"> · Distributed Systems &amp; API Idempotency ❯ </tspan>
        <tspan fill="#e5c07b">Wir müssen sicherstellen, dass diese Schnittstelle idempotent ist</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#7a8478">  · </tspan>
        <tspan fill="#859289">[Source] </tspan>
        <tspan fill="#d3c6aa">Wir müssen sicherstellen, dass diese Schnittstelle idempotent ist</tspan>
      </text>
      <text x="0" y="46">
        <tspan fill="#7a8478">  ┌ </tspan>
        <tspan fill="#a7c080" font-weight="bold">[Spoken]   </tspan>
        <tspan fill="#e5c07b">We've gotta make sure this endpoint is strictly idempotent so duplicate requests don't </tspan><tspan fill="#e5c07b" text-decoration="underline">bite us</tspan><tspan fill="#e5c07b">. </tspan>
        <tspan fill="#859289">(damit Doppelklicks uns nicht um die Ohren fliegen)</tspan>
      </text>
      <text x="0" y="68">
        <tspan fill="#7a8478">  ├ </tspan>
        <tspan fill="#7fbbb3" font-weight="bold">[Written]  </tspan>
        <tspan fill="#83a598">It is imperative to guarantee strict idempotency for this API endpoint to prevent duplicate mutations. </tspan>
        <tspan fill="#859289">(strikte Idempotenz für den Endpunkt garantieren)</tspan>
      </text>
      <text x="0" y="90">
        <tspan fill="#7a8478">  └ </tspan>
        <tspan fill="#dbbc7f" font-weight="bold">[Vocab]    </tspan>
        <tspan fill="#d3c6aa">strictly idempotent </tspan><tspan fill="#7a8478">(strikt idempotent) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">bite us </tspan><tspan fill="#7a8478">(Probleme bereiten) </tspan>
        <tspan fill="#859289">· </tspan>
        <tspan fill="#d3c6aa">imperative </tspan><tspan fill="#7a8478">(zwingend erforderlich)</tspan>
      </text>
    </g>

    <!-- Bottom Metrics Banner -->
    <rect x="21" y="660" width="878" height="40" rx="0" fill="#181b1d" />
    <line x1="20" y1="660" x2="900" y2="660" stroke="#2d353b" stroke-width="1" />
    <text x="45" y="685" fill="#859289" font-size="11">
      <tspan fill="#a7c080">●</tspan> Zero Context Pollution  ·  
      <tspan fill="#7fbbb3">●</tspan> 0ms Shield Fast-Bypass  ·  
      <tspan fill="#dbbc7f">●</tspan> 50-Entry LRU Cache  ·  
      <tspan fill="#e67e80">●</tspan> Dynamic Config-Driven Sovereignty
    </text>
    <text x="875" y="685" text-anchor="end" fill="#859289" font-size="11">
      Universal Minimal Chrome · CJK 2-Cell Safe Left-Rail Layout
    </text>
  </g>
</svg>
